  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: #000; overflow: hidden; }
    .bv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 16px; background: #0b0907; border-bottom: 1px solid rgba(201,160,64,0.18); font-family: var(--font-ui); font-size: 0.85rem; }
    .bv-bar a { color: var(--text-dim); text-decoration: none; }
    .bv-bar a:hover { color: var(--gold-bright); }
    .bv-turn { flex: 1; text-align: center; font-family: var(--font-head); color: var(--text-bright); font-size: clamp(1rem, 2.4vw, 1.6rem); overflow-wrap: anywhere; }
    .bv-turn strong { color: var(--gold-bright); }
    .bv-next { color: var(--text-dim); }
    .bv-sync { color: var(--text-dim); font-size: 0.75rem; }
    .bv-bar button { font-family: var(--font-ui); font-size: 0.8rem; padding: 6px 12px; background: var(--bg-deep); color: var(--text-mid); border: 1px solid var(--gold-dim); border-radius: var(--radius-sm); cursor: pointer; }
    .bv-bar button:hover { color: var(--gold-bright); border-color: var(--gold-mid); }
    :fullscreen .bv-bar a, :fullscreen .bv-bar button, :fullscreen .bv-sync { opacity: 0.15; transition: opacity 0.3s; }
    :fullscreen .bv-bar:hover a, :fullscreen .bv-bar:hover button, :fullscreen .bv-bar:hover .bv-sync { opacity: 1; }
    .bv-main { position: relative; flex: 1; min-height: 0; }
    .bv-stage { position: absolute; inset: 0; }
    .bv-stage svg { display: block; width: 100%; height: 100%; }
    .bv-dark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; padding: 0 16px; width: min(90%, 640px); text-align: center; font-family: var(--font-head); font-size: clamp(1.1rem, 3vw, 2rem); color: var(--text-dim); pointer-events: none; }
    .bv-dark[hidden] { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  </style>

<body>
  <div class="bv-bar">
    <a href="dnd-battlemap-builder">🧱 Battlemap Builder</a>
    <span class="bv-turn" id="bv-turn" aria-live="polite"></span>
    <span class="bv-sync" id="bv-sync"></span>
    <button type="button" id="bv-full" title="Fill the screen (F; Esc to leave)">⛶ Full Screen</button>
  </div>
  <main class="bv-main">
    <h1 class="sr-only">Player view: battlemap</h1>
    <div class="bv-stage" id="bv-stage"></div>
    <p class="bv-dark" id="bv-dark" hidden></p>
  </main>

</body>
