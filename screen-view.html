  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .sv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; border-bottom: 1px solid rgba(201,160,64,0.18); font-family: var(--font-ui); font-size: 0.85rem; }
    .sv-bar a { color: var(--text-dim); text-decoration: none; margin-right: auto; }
    .sv-bar a:hover { color: var(--gold-bright); }
    .sv-bar button { font-family: var(--font-ui); font-size: 0.8rem; padding: 6px 12px; background: var(--bg-deep); color: var(--text-mid); border: 1px solid var(--gold-dim); border-radius: var(--radius-sm); cursor: pointer; }
    .sv-bar button:hover, .sv-bar button[aria-pressed="true"] { color: var(--gold-bright); border-color: var(--gold-mid); }
    :fullscreen .sv-bar { opacity: 0.15; transition: opacity 0.3s; }
    :fullscreen .sv-bar:hover, :fullscreen .sv-bar:focus-within { opacity: 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    .sv-main { width: 100%; max-width: 1500px; margin: 0 auto; padding: 22px 16px 40px; flex: 1; }
    .sv-board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
    @media (min-width: 720px) { .sv-board { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ds-w2, .ds-w3 { grid-column: span 2; } }
    @media (min-width: 1150px) { .sv-board { grid-template-columns: repeat(3, minmax(0, 1fr)); } .ds-w3 { grid-column: span 3; } }
    .sv-card { background: linear-gradient(145deg, var(--bg-card), var(--bg-dark)); border: 1px solid var(--gold-dim); border-radius: var(--radius-md); padding: 14px 18px 16px; min-width: 0; }
    .sv-card h2 { font-family: var(--font-head); font-size: 1.15rem; color: var(--gold-bright); margin: 0 0 10px; overflow-wrap: anywhere; }
    .sv-card p { color: var(--text-mid); line-height: 1.5; margin: 0 0 8px; }
    .sv-sub { font-family: var(--font-ui); font-size: 0.9rem; text-align: center; }
    .sv-sub strong { color: var(--gold-bright); }
    .sv-faint { color: var(--text-dim) !important; font-style: italic; }
    .sv-result { font-family: var(--font-body); font-size: 1.35rem; color: var(--text-bright) !important; overflow-wrap: anywhere; }
    .sv-total { font-family: var(--font-display); font-size: 3.4rem; color: var(--gold-bright) !important; text-align: center; line-height: 1.1; margin: 0 !important; }
    .ds-pre { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-mid); line-height: 1.55; font-size: 1.05rem; }
    .ds-crit { font-family: var(--font-ui); font-size: 0.75rem; padding: 2px 9px; border-radius: 10px; }
    .ds-crit.hit { background: var(--gold-mid); color: #000; }
    .ds-crit.miss { background: var(--crimson); color: var(--text-bright); }

    .sv-clock { max-width: 220px; margin: 0 auto 6px; }
    .clk-svg { display: block; width: 100%; height: auto; }
    .clk-seg { fill: rgba(201,160,64,0.06); stroke: var(--gold-mid); stroke-width: 1.4; stroke-linejoin: round; }
    .clk-seg.on { fill: var(--gold-mid); }
    .full .clk-seg.on { fill: var(--crimson-bright); }
    .clk-rim { fill: none; stroke: var(--gold-bright); stroke-width: 2; }

    .sv-party { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .sv-party li { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; padding: 6px 10px; border: 1px solid rgba(201,160,64,0.18); border-radius: var(--radius-sm); font-family: var(--font-ui); font-size: 0.9rem; color: var(--text-mid); }
    .sv-party strong { font-family: var(--font-head); color: var(--text-bright); font-size: 1.05rem; margin-right: auto; }

    /* Initiative (init-view.js) */
    .pv-list { list-style: none; display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 10px 0 0; }
    .pv-row { display: grid; grid-template-columns: 1.4em 1fr auto; align-items: center; gap: 4px 12px; padding: 8px 12px; background: var(--bg-deep); border: 1px solid rgba(201,160,64,0.18); border-radius: var(--radius-md); font-size: 1.05rem; }
    .pv-row.pv-now { border-color: var(--gold-mid); background: var(--bg-raised); box-shadow: var(--shadow-glow); }
    .pv-mark { color: var(--gold-bright); font-family: var(--font-ui); }
    .pv-who { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-family: var(--font-head); color: var(--text-bright); }
    .pv-name { overflow-wrap: anywhere; }
    .pv-hidden .pv-name { color: var(--text-mid); font-style: italic; font-family: var(--font-body); }
    .pv-down .pv-name { text-decoration: line-through; color: var(--text-dim); }
    .pv-health { font-family: var(--font-ui); font-size: 0.8em; white-space: nowrap; }
    .pv-healthy { color: #8fc48a; }
    .pv-bloodied { color: #e57368; }
    .pv-down.pv-row .pv-health { color: var(--text-dim); }
    .pv-conds { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
    .pv-cond { font-family: var(--font-ui); font-size: 0.65em; padding: 2px 9px; border-radius: 10px; background: var(--crimson); color: var(--text-bright); }

    /* Rules (rules-data.js) */
    .rules-card p, .rules-card li { font-size: 0.95rem; line-height: 1.5; color: var(--text-mid); margin: 0 0 6px; }
    .rules-card ul { margin: 6px 0 0; padding-left: 18px; }
    .rules-card dl > div { padding: 6px 0; border-top: 1px dashed rgba(201,160,64,0.18); }
    .rules-card dl > div:first-child { border-top: none; padding-top: 0; }
    .rules-card dt { font-family: var(--font-body); font-size: 1.08rem; color: var(--text-bright); }
    .rules-card dd { margin: 0 0 2px 14px; font-size: 0.92rem; line-height: 1.45; color: var(--text-mid); position: relative; }
    .rules-card dd::before { content: '•'; position: absolute; left: -11px; color: var(--gold-dim); }
    .rules-card .rules-table { overflow-x: auto; margin: 8px 0 4px; }
    .rules-card table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .rules-card th { font-family: var(--font-ui); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold-mid); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--gold-dim); }
    .rules-card td { padding: 5px 6px; color: var(--text-mid); border-bottom: 1px dashed rgba(201,160,64,0.15); vertical-align: top; }
    .rules-card td:first-child { color: var(--text-bright); }
    .rules-card .rules-note { font-family: var(--font-ui); font-size: 0.75rem !important; color: var(--text-dim) !important; }

    .sv-empty { text-align: center; color: var(--text-dim); font-style: italic; margin-top: 40px; }
    .sv-empty[hidden] { display: none; }
    .sv-note { max-width: 900px; margin: 0 auto; padding: 0 16px 24px; font-family: var(--font-ui); font-size: 0.75rem; color: var(--text-dim); text-align: center; }

    /* Big text: for a TV across the room. */
    body.sv-big .sv-card h2 { font-size: clamp(1.4rem, 2.6vw, 2.2rem); }
    body.sv-big .sv-card p, body.sv-big .ds-pre, body.sv-big .rules-card dd, body.sv-big .rules-card li, body.sv-big .rules-card td { font-size: clamp(1.1rem, 2vw, 1.6rem); }
    body.sv-big .sv-result { font-size: clamp(1.6rem, 3vw, 2.6rem); }
    body.sv-big .sv-total { font-size: clamp(4rem, 9vw, 7rem); }
    body.sv-big .sv-clock { max-width: 340px; }
    body.sv-big .pv-row { font-size: clamp(1.3rem, 2.6vw, 2rem); }
    body.sv-big .sv-party li { font-size: clamp(1.1rem, 2vw, 1.5rem); }
    body.sv-big .sv-note { display: none; }

    @media (max-width: 480px) {
      .pv-row { grid-template-columns: 1.2em 1fr; font-size: 1rem; }
      .pv-health { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="sv-bar">
    <a href="dm-screen">🛡️ Back to the DM screen</a>
    <button type="button" id="sv-big" aria-pressed="false" title="Bigger text for a TV across the room">🔠 Big Text</button>
    <button type="button" id="sv-full" title="Fill the screen (Esc to leave)">⛶ Full Screen</button>
  </div>
  <main class="sv-main">
    <h1 class="sr-only">Players' screen</h1>
    <div class="sv-board" id="sv-board" aria-live="polite"></div>
    <p class="sv-empty" id="sv-empty" hidden>Nothing to see here yet. The DM picks the cards for this screen with 📺.</p>
  </main>
  <p class="sv-note">This window shows the cards marked 📺 on the DM screen in this browser, and follows every change. Drag it to a TV or second screen.</p>

  <script src="rng.js"></script>
  <script src="rules-data.js"></script>
  <script src="table-engine.js"></script>
  <script src="toolbox-clocks.js"></script>
  <script src="party.js"></script>
  <script src="init-view.js"></script>
  <script src="notebook.js"></script>
  <script src="dm-screen-data.js"></script>
  <script src="screen-view.js"></script>
</body>
</html>
