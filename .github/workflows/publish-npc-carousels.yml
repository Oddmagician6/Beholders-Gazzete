name: Publish approved NPC carousels
run-name: NPC carousels - ${{ inputs.operation || 'run_due' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify without posting, arm the approved week, or publish due Instagram posts
        type: choice
        options: [verify, arm, run_due]
        default: verify
        required: true
  schedule:
    # The second run catches a delayed/missed first run; durable state prevents duplicates.
    - cron: '0,30 9 * * *'
      timezone: 'America/Chicago'

concurrency:
  group: npc-carousel-publisher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check publisher behavior
        run: python3 -m unittest discover -s .github/scripts -p 'test_npc_carousels.py' -v
      - name: Verify, arm, or publish approved carousels
        env:
          GH_TOKEN: ${{ github.token }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          OPERATION: ${{ inputs.operation || 'run_due' }}
        run: python3 .github/scripts/publish_npc_carousels.py
      - name: Upload publishing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-carousel-report-${{ github.run_id }}
          path: ${{ runner.temp }}/npc-carousel-report.json
          if-no-files-found: ignore
