name: Publish approved Loot Drop cards - month 2
run-name: Loot Drop month 2 - ${{ inputs.operation || 'run_due' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify without posting, arm this approved batch, or publish due Instagram posts
        type: choice
        options: [verify, arm, run_due]
        default: verify
        required: true
  schedule:
    # Loot Drop cards post Thursdays at 12:00 Chicago (CST: 18:00 UTC). GitHub starts scheduled runs late
    # or drops them, so retries run every half hour through the 12-hour window; state prevents duplicates.
    - cron: '7,37 18-23 * * 4'
    - cron: '7,37 0-5 * * 5'

concurrency:
  group: loot-card-publisher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check publisher behavior
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_npc_carousels.py'
          python3 -m unittest discover -s .github/scripts -p 'test_ad_cards.py' -v
      - name: Verify, arm, or publish approved Loot Drop cards
        env:
          GH_TOKEN: ${{ github.token }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          OPERATION: ${{ inputs.operation || 'run_due' }}
          AD_BATCH: month02
          CARD_SERIES: loot
        run: python3 .github/scripts/publish_ad_cards.py
      - name: Upload publishing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loot-cards-month02-report-${{ github.run_id }}
          path: ${{ runner.temp }}/npc-carousel-report.json
          if-no-files-found: ignore
