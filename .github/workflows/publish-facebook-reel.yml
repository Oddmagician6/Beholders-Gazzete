name: Publish approved Facebook Reel
run-name: Publish Reel — ${{ inputs.article_id }}

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: Article ID for the approved Reel
        required: true
        type: string
      operation:
        description: Publish a Reel or verify an existing schedule
        required: false
        type: choice
        options:
          - publish
          - confirm_schedule
          - reschedule
        default: publish
      release_tag:
        description: Temporary public GitHub Release containing render.mp4
        required: false
        type: string
      custom_artwork_confirmed:
        description: Confirm the Reel uses custom article-specific artwork
        required: false
        type: boolean
        default: false
      video_id:
        description: Existing Facebook video ID (confirm_schedule operation only)
        required: false
        type: string
        default: ''
      hashtags:
        description: Story hashtags, space-separated (e.g. "#MooseRescue #SkatePark"); added after the standard D&D tags
        required: false
        type: string
        default: ''
      scheduled_publish_time:
        description: Optional Facebook schedule time as a Unix timestamp in seconds
        required: false
        type: string
        default: ''

concurrency:
  group: facebook-reel-${{ inputs.article_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Validate and download staged Reel
        if: ${{ inputs.operation == 'publish' }}
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CUSTOM_ARTWORK_CONFIRMED: ${{ inputs.custom_artwork_confirmed }}
        run: |
          set -euo pipefail
          [[ "$CUSTOM_ARTWORK_CONFIRMED" == "true" ]] || { echo "Custom article-specific artwork must be confirmed before publishing." >&2; exit 1; }
          [[ "$ARTICLE_ID" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo "Invalid article ID." >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^reel-stage-[a-z0-9-]+$ ]] || { echo "Release tag must start with reel-stage-." >&2; exit 1; }
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/render.mp4"
          curl --fail --location --silent --show-error --retry 3 "$url" --output "$RUNNER_TEMP/$ARTICLE_ID.mp4"
          test -s "$RUNNER_TEMP/$ARTICLE_ID.mp4"

      - name: Upload and publish Facebook Reel
        if: ${{ inputs.operation != 'reschedule' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          ARTICLE_ID: ${{ inputs.article_id }}
          VIDEO_ID: ${{ inputs.video_id }}
          HASHTAGS: ${{ inputs.hashtags }}
          SCHEDULED_PUBLISH_TIME: ${{ inputs.scheduled_publish_time }}
          VIDEO_PATH: ${{ runner.temp }}/${{ inputs.article_id }}.mp4
        run: python3 .github/scripts/publish_facebook_reel.py

      - name: Reschedule existing Facebook Reel
        if: ${{ inputs.operation == 'reschedule' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          ARTICLE_ID: ${{ inputs.article_id }}
          VIDEO_ID: ${{ inputs.video_id }}
          SCHEDULED_PUBLISH_TIME: ${{ inputs.scheduled_publish_time }}
        run: python3 .github/scripts/publish_facebook_reel.py

      - name: Remove temporary public staging release
        if: ${{ success() && inputs.operation == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release delete "$RELEASE_TAG" --cleanup-tag --yes
