  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; border-bottom: 1px solid rgba(201,160,64,0.18); font-family: var(--font-ui); font-size: 0.85rem; }
    .pv-bar a { color: var(--text-dim); text-decoration: none; margin-right: auto; }
    .pv-bar a:hover { color: var(--gold-bright); }
    .pv-bar button { font-family: var(--font-ui); font-size: 0.8rem; padding: 6px 12px; background: var(--bg-deep); color: var(--text-mid); border: 1px solid var(--gold-dim); border-radius: var(--radius-sm); cursor: pointer; }
    .pv-bar button:hover, .pv-bar button[aria-pressed="true"] { color: var(--gold-bright); border-color: var(--gold-mid); }
    .pv-bar .pv-sync { color: var(--text-dim); font-size: 0.75rem; }
    :fullscreen .pv-bar { opacity: 0.15; transition: opacity 0.3s; }
    :fullscreen .pv-bar:hover, :fullscreen .pv-bar:focus-within { opacity: 1; }

    .pv-main { width: 100%; max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; flex: 1; }
    .pv-head { text-align: center; margin-bottom: 22px; }
    .pv-round { font-family: var(--font-display); color: var(--gold-bright); font-size: clamp(1.6rem, 5vw, 2.6rem); line-height: 1.2; }
    .pv-turn { font-family: var(--font-head); color: var(--text-bright); font-size: clamp(1rem, 3vw, 1.4rem); margin-top: 6px; overflow-wrap: anywhere; }
    .pv-turn strong { color: var(--gold-bright); }
    .pv-turn .pv-next { display: block; color: var(--text-dim); font-size: 0.8em; }

    .pv-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .pv-row { display: grid; grid-template-columns: 1.4em 1fr auto; align-items: center; gap: 4px 12px; padding: 10px 14px; background: var(--bg-card); border: 1px solid rgba(201,160,64,0.18); border-radius: var(--radius-md); font-size: 1.15rem; }
    .pv-row.pv-now { border-color: var(--gold-mid); background: var(--bg-raised); box-shadow: var(--shadow-glow); }
    .pv-mark { color: var(--gold-bright); font-family: var(--font-ui); }
    .pv-who { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-family: var(--font-head); color: var(--text-bright); }
    .pv-name { overflow-wrap: anywhere; }
    .pv-hidden .pv-name { color: var(--text-mid); font-style: italic; font-family: var(--font-body); }
    .pv-down .pv-name { text-decoration: line-through; color: var(--text-dim); }
    .pv-health { font-family: var(--font-ui); font-size: 0.8em; white-space: nowrap; }
    .pv-healthy { color: #8fc48a; }
    .pv-bloodied { color: #e57368; }
    .pv-down.pv-row .pv-health { color: var(--text-dim); }
    .pv-conds { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
    .pv-cond { font-family: var(--font-ui); font-size: 0.65em; padding: 2px 9px; border-radius: 10px; background: var(--crimson); color: var(--text-bright); }
    .pv-empty { text-align: center; color: var(--text-dim); font-style: italic; margin-top: 20px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .pv-note { max-width: 900px; margin: 0 auto; padding: 0 16px 24px; font-family: var(--font-ui); font-size: 0.75rem; color: var(--text-dim); text-align: center; }

    /* Big text: for a TV across the room. */
    body.pv-big .pv-main { max-width: 1400px; }
    body.pv-big .pv-round { font-size: clamp(2.2rem, 7vw, 4.5rem); }
    body.pv-big .pv-turn { font-size: clamp(1.4rem, 4.2vw, 2.6rem); }
    body.pv-big .pv-row { font-size: clamp(1.4rem, 3.6vw, 2.4rem); padding: 14px 22px; gap: 6px 20px; }
    body.pv-big .pv-note { display: none; }

    @media (max-width: 480px) {
      .pv-row { grid-template-columns: 1.2em 1fr; font-size: 1rem; }
      .pv-health { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="pv-bar">
    <a href="toolbox.html?tab=init">⚔️ Back to the tracker</a>
    <span class="pv-sync" id="pv-sync"></span>
    <button type="button" id="pv-big" aria-pressed="false" title="Bigger text for a TV across the room">🔠 Big Text</button>
    <button type="button" id="pv-full" title="Fill the screen (Esc to leave)">⛶ Full Screen</button>
  </div>
  <main class="pv-main">
    <h1 class="sr-only">Player view: initiative</h1>
    <div class="pv-head" aria-live="polite">
      <div class="pv-round" id="pv-round">No fight yet</div>
      <div class="pv-turn" id="pv-turn"></div>
    </div>
    <ol class="pv-list" id="pv-list"></ol>
    <p class="pv-empty" id="pv-empty" hidden>The DM's initiative tracker is empty.</p>
  </main>
  <p class="pv-note">This window follows the DM Toolbox's initiative tracker in this browser. Leave the tracker open in another window and drag this one to a TV or second screen.</p>

  <script src="init-view.js"></script>
  <script src="player-view.js"></script>
</body>
</html>
